[project]
name = "python-sbb-polarion"
version = "3.4.0"  # the version is controlled by the pipeline
description = "Python library for Polarion requirements management system - provides utilities, core API, extension clients, and testing helpers"
authors = [
    {name = "SBB Polarion Team", email = "polarion-opensource@sbb.ch"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "ldap3>=2.9",
    "psycopg2-binary>=2.9",
    "paramiko>=3.2",
    "requests>=2.31",
    "sshtunnel>=0.4",
    "oauthlib>=3.2",
    "requests-oauthlib>=1.3",
    "testcontainers>=3.7",
    "docker>=7.0",
    "tzlocal>=5.4.3",
]

[project.urls]
Homepage = "https://github.com/SchweizerischeBundesbahnen/python-sbb-polarion"
Repository = "https://github.com/SchweizerischeBundesbahnen/python-sbb-polarion"

[project.scripts]
python-sbb-polarion-lint = "python_sbb_polarion.linter:main"

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.3",
    "mypy==2.3.1",
    "types-requests>=2.32.4.20250913",
    "types-paramiko>=4.0.0.20250822",
    "types-psycopg2>=2.9.21.20251012",
    "types-ldap3>=2.9.13.20250622",
    "types-oauthlib>=3.3.0.20250822",
    "types-requests-oauthlib>=2.0.0.20250809",
    "types-docker>=7.1.0.20241231",
    "python-dotenv>=1.1.1",
]
test = [
    "tox==4.60.0",
    "tox-uv==1.36.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_sbb_polarion"]


# =============================================================================
# Ruff Configuration (2025 Best Practices)
# =============================================================================
# Philosophy: Start strict with ALL rules, then relax intentionally with clear justification
# Reference: r/Python community consensus + Ruff official formatter conflicts

[tool.ruff]
line-length = 240  # Match existing codebase standard (pylint)
indent-width = 4
target-version = "py311"  # Minimum supported Python version
exclude = [
    ".venv",
    ".tox",
    "build",
    "dist",
]

[tool.ruff.lint.flake8-quotes]
# The lint half of the quote decision. These are what Q000, Q001 and Q002 read,
# and with the Q rules enabled they decide a lint result, so they are stated
# rather than inherited. Keep them equal to format.quote-style below: diverge and
# Q000 fires on the string the formatter just rewrote.
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"
# The fourth option, and the one that decides whether Q003 runs at all: set it to
# false and the rule stops reporting with nothing red to show for it.
avoid-escape = true

[tool.ruff.format]
# Black-compatible formatting
indent-style = "space"
line-ending = "lf"
# The format half. Changing this means changing flake8-quotes above in step.
quote-style = "double"
docstring-code-format = true
docstring-code-line-length = 120  # Slightly shorter for code in docstrings

[tool.ruff.lint]
# Shared standard for all SBB Python repositories.
# Never use extend-select: it inherits ruff's implicit default, which widened in
# ruff 0.16 and broke CI everywhere. Keep preview off, preview rules churn.
#
# ALL still means "every stable rule in the installed ruff", so a ruff bump can
# introduce findings. That is the accepted trade: a clean bump automerges, and a
# dirty one turns the new rules into a change someone reads. What this config
# removes is the version dependency we did not choose and could not see.
select = ["ALL"]
preview = false
ignore = [
    # ruff format owns this formatting decision. COM812 is the only rule ruff
    # itself reports as conflicting, so it is the only entry here. The Q00x rules
    # are deliberately absent rather than ignored: Q000, Q002 and Q003 fire
    # nowhere across the eight repositories, and Q001 fires in one of them but is
    # auto-fixable and ruff format runs before ruff check in both tox.ini and
    # pre-commit, so the formatter resolves it. That ordering is load-bearing:
    # reverse it — the upstream ruff-pre-commit example puts check first — and
    # these entries have to come back. The quote decision itself is pinned at the
    # bottom of this file, on both the format and the lint side.
    "COM812",  # trailing comma

    # Not our convention
    "D",       # docstrings are optional, we mandate no docstring style
    "CPY001",  # we ship no copyright headers
    "FIX002",  # a TODO is a normal marker, not a defect; TD002 and TD003 still
               # require it to name an author and link an issue
    "EM101",   # a literal at the raise site reads better than a temp name
    "EM102",   # same for an f-string
    "TRY003",  # we want the full message where the raise happens
    "TRY400",  # a handled error is logged without a traceback
    "TRY401",  # the exception text belongs on the log line, not only in the traceback
    "G004",    # we ingest plain log lines, not templates, so f-strings are fine
    "ANN401",  # Any is correct at JSON and **kwargs boundaries
    "FBT001",  # a boolean query parameter is part of the HTTP API
    "FBT002",  # same, with a default

    # Repository-specific entries belong below this line, each with a reason, so
    # the next sync of the shared block above can tell the two apart. Without the
    # line a local entry looks shared and the sync deletes it silently.
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is how a test states its expectation
    "S105",    # test credentials are fake by construction
    "S106",    # same, passed as an argument
    "S108",    # a temp path in a test is not a shared temp path
    "S603",    # tests run known helper binaries
    "S607",    # those binaries come from PATH on purpose
    "SLF001",  # a test may assert on internal state
    "PLC0415", # a local import is how a test patches a module
    "ANN",     # a test signature carries no type information
    "ARG",     # a fixture argument is used by pytest, not by the body
    "PLR2004", # a literal is readable test data
    "PT",      # unittest style is allowed next to pytest style
    "E402",    # a test may import after patching
    "TC",      # a test module is imported once, deferring imports buys nothing
    "S104",    # a host string in test data is not a binding
    "S314",    # a test parses the XML fixture it wrote itself
    "FBT003",  # mock.patch takes the replacement value positionally
    "C901",    # a fixture is linear setup, splitting it hides the order
    "PLR0912", # same, for its branches
    "PLR0915", # same, for its statements
]

# Repository-specific per-file ignores belong below this line, each with a
# reason, and each in the "glob" = ["RULE"] form of the table above.
#
# A repository-wide ignore does NOT go here. This is still
# [tool.ruff.lint.per-file-ignores], so a bare ignore = ["RULE"] parses as a
# glob named "ignore" that matches no file: it is accepted, it silences
# nothing, and ruff says nothing. Add such a rule below the marker inside the
# ignore list above.

"python_sbb_polarion/testing/**/*.py" = [
    "S101",    # this package is test infrastructure, assert is its vocabulary
    "TC003",   # Path is instantiated and called here, not only annotated
]
"python_sbb_polarion/linter/**/*.py" = [
    "TC003",   # same, Path is used at runtime in this subpackage
]
"**/__init__.py" = [
    "F401",    # a package re-exports its public names
]

[tool.ruff.lint.isort]
# Import sorting configuration (replaces isort)
force-single-line = false
force-sort-within-sections = false
lines-after-imports = 2
known-first-party = ["python_sbb_polarion"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.14"                  # Tells mypy to check against Python 3.14 features
warn_return_any = true                   # Warns if function returns 'Any' type
warn_unused_configs = true               # Warns about unused mypy settings
disallow_untyped_defs = true             # Disallows functions without type hints
disallow_incomplete_defs = true          # Disallows partially typed functions
check_untyped_defs = true                # Type checks bodies of functions without type annotations
disallow_untyped_calls = false           # Allow calling untyped functions (too strict for third-party libs)
warn_redundant_casts = true              # Warns about unnecessary type casts
warn_unused_ignores = true               # Warns about unused '# type: ignore' comments
warn_no_return = true                    # Warns about functions that don't return a value
warn_unreachable = true                  # Warns about unreachable code
strict_equality = true                   # Strict checking of equality operations
extra_checks = true                      # Enable additional checks (replaces strict_concatenate)
no_implicit_optional = true              # Disallows implicit Optional types (e.g., x: str = None)

# Strict Any checks - prevent untyped variables
disallow_any_unimported = true           # Disallows Any from unfollowed imports (stricter typing)
disallow_any_generics = true             # Requires type parameters for generic types (e.g., list[str] not list)
disallow_subclassing_any = true          # Disallows subclassing Any types

# testcontainers library has no type stubs
[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# sshtunnel library has no type stubs
[[tool.mypy.overrides]]
module = ["sshtunnel", "sshtunnel.*"]
ignore_missing_imports = true

# Testing helper uses testcontainers without stubs
[[tool.mypy.overrides]]
module = ["python_sbb_polarion.testing.testcontainers_helper"]
disallow_any_unimported = false
